<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Public Stats</title>
<style>
  :root{
    --bg:#faf8f5; --surface:#ffffff; --border:#e4ded3;
    --fg:#1c1a17; --muted:#7a7266; --accent:#d4621f; --accent-soft:#f4e3d4;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15130f; --surface:#1e1b16; --border:#332e26;
      --fg:#efe9df; --muted:#a39a89; --accent:#f08a3c; --accent-soft:#3a2a1a;
      color-scheme: dark;
    }
  }
  *{box-sizing:border-box}
  body{
    background:var(--bg); color:var(--fg); margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  .wrap{max-width:760px; margin:0 auto; padding:48px 16px 32px}
  h1{font-size:1.5rem; font-weight:700; margin:0 0 4px}
  .sub{color:var(--muted); font-size:0.9rem; margin:0 0 32px}
  .note{
    background:var(--accent-soft); border:1px solid var(--border); border-radius:10px;
    padding:14px 16px; font-size:0.85rem; color:var(--fg); line-height:1.5; margin-bottom:28px;
  }
  .note strong{color:var(--accent)}
  .project{margin-bottom:12px}
  .project-title{font-size:1.1rem; font-weight:700; margin:0 0 4px}
  .project-desc{font-size:0.85rem; color:var(--muted); margin:0 0 16px}
  .tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:24px}
  .tile{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:18px 20px}
  .tile .label{font-size:0.78rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:6px}
  .tile .value{font-size:1.9rem; font-weight:700; font-variant-numeric:tabular-nums}
  .tile .value.accent{color:var(--accent)}
  .chart-card{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:20px; margin-bottom:28px}
  .chart-card h3{font-size:0.95rem; margin:0 0 16px; font-weight:600}
  .line-chart{width:100%; height:auto; overflow:visible}
  .line-chart .grid-line{stroke:var(--border); stroke-width:1}
  .line-chart .trend{fill:none; stroke:var(--accent); stroke-width:2}
  .line-chart .point{fill:var(--accent)}
  .line-chart .value-label{fill:var(--fg); font-size:11px; font-variant-numeric:tabular-nums; text-anchor:middle}
  .line-chart .episode-label{fill:var(--muted); font-size:10px; text-anchor:middle}
  footer{color:var(--muted); font-size:0.78rem; padding-bottom:32px}
  .error{color:var(--muted); font-size:0.9rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>Public Stats</h1>
  <p class="sub">Live metrics from anonymous YouTube Shorts channels, updated daily.</p>

  <div class="note">
    <strong>Note:</strong> each channel name is intentionally withheld while the experiment is ongoing.
  </div>

  <div id="projects"></div>

  <footer id="footer"></footer>
</div>

<script>
  function buildLineChart(videos) {
    if (!videos || videos.length === 0) {
      return '<p class="error">No episodes yet.</p>';
    }

    const width = 640;
    const height = 180;
    const padTop = 28;
    const padBottom = 24;
    const padSide = 24;
    const innerWidth = width - padSide * 2;
    const innerHeight = height - padTop - padBottom;

    const max = Math.max(1, ...videos.map((v) => v.views));
    const n = videos.length;

    const points = videos.map((v, i) => {
      const x = n > 1 ? padSide + (i / (n - 1)) * innerWidth : padSide + innerWidth / 2;
      const y = padTop + innerHeight - (v.views / max) * innerHeight;
      return { x, y, episode: v.episode, views: v.views };
    });

    const path = points
      .map((p, i) => (i === 0 ? "M" : "L") + p.x.toFixed(1) + "," + p.y.toFixed(1))
      .join(" ");

    const baselineY = (padTop + innerHeight).toFixed(1);

    const pointsSvg = points
      .map(
        (p) =>
          '<text class="value-label" x="' + p.x + '" y="' + (p.y - 10) + '">' +
            p.views.toLocaleString() +
          "</text>" +
          '<circle class="point" cx="' + p.x + '" cy="' + p.y + '" r="3.5"></circle>' +
          '<text class="episode-label" x="' + p.x + '" y="' + (height - 6) + '">' +
            p.episode +
          "</text>",
      )
      .join("");

    return (
      '<svg class="line-chart" viewBox="0 0 ' + width + " " + height + '" role="img" aria-label="Views per episode line chart">' +
        '<line class="grid-line" x1="' + padSide + '" y1="' + baselineY + '" x2="' + (width - padSide) + '" y2="' + baselineY + '"></line>' +
        '<path class="trend" d="' + path + '"></path>' +
        pointsSvg +
      "</svg>"
    );
  }

  async function render() {
    const container = document.getElementById("projects");
    const footer = document.getElementById("footer");
    let data;
    try {
      const res = await fetch("stats.json", { cache: "no-store" });
      data = await res.json();
    } catch (e) {
      container.innerHTML = '<p class="error">Stats are not available yet.</p>';
      return;
    }

    for (const project of data.projects || []) {
      const section = document.createElement("section");
      section.className = "project";

      const chartHtml = buildLineChart(project.videos);

      const avgViews = project.videoCount
        ? Math.round(project.totalViews / project.videoCount)
        : 0;

      section.innerHTML =
        '<h2 class="project-title">' + project.label + "</h2>" +
        (project.description ? '<p class="project-desc">' + project.description + "</p>" : "") +
        '<div class="tiles">' +
          '<div class="tile"><div class="label">Total views</div><div class="value">' + project.totalViews.toLocaleString() + "</div></div>" +
          '<div class="tile"><div class="label">Videos published</div><div class="value">' + project.videoCount + "</div></div>" +
          '<div class="tile"><div class="label">Avg. views / video</div><div class="value accent">' + avgViews.toLocaleString() + "</div></div>" +
        "</div>" +
        '<div class="chart-card">' +
          "<h3>Views per episode (upload order)</h3>" +
          chartHtml +
        "</div>";

      container.appendChild(section);
    }

    if (data.updatedAt) {
      const date = new Date(data.updatedAt).toLocaleDateString(undefined, {
        year: "numeric", month: "short", day: "numeric",
      });
      footer.textContent = "Last updated " + date;
    }
  }

  render();
</script>
</body>
</html>
